esphome:
  name: diesel-heater-minimal-time-test
  build_path: /tmp/diesel-heater-esphome-minimal-time

esp32:
  board: lolin32_lite
  variant: esp32
  framework:
    type: esp-idf

logger:

wifi:
  ssid: "test-network"
  password: "test-password"

time:
  - platform: sntp
    id: heater_clock
    servers: [time.example.invalid]

external_components:
  - source:
      type: local
      path: ../components
    components: [diesel_heater_ble]

esp32_ble_tracker:

ble_client:
  id: heater_ble_client
  mac_address: "02:00:00:00:00:01"

diesel_heater_ble:
  id: heater
  ble_client_id: heater_ble_client
  protocol: auto
  passkey: 1234
  time_id: heater_clock
